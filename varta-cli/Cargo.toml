[package]
name = "varta-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "varta-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "time"] }
zencan-client = { git = "https://github.com/mcbridejc/zencan.git", features = ["socketcan"] }

varta-easyblade = { path = "../varta-easyblade" }
